<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="wordmark">
          <span class="logo" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M9 6v12M14 8.5v7M19 11v2"/></svg>
          </span>
          <h1>Simple Reader</h1>
        </div>
        <button id="btn-settings" class="icon-btn" title="Settings" aria-label="Settings" aria-expanded="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <!-- settings -->
      <section id="panel-settings" hidden>
        <div class="field">
          <span>Highlight</span>
          <div id="swatches" class="swatches" role="radiogroup" aria-label="Highlight color"></div>
        </div>
      </section>

      <!-- idle -->
      <section id="view-idle" hidden>
        <div class="wave" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <h2>Listen to this page</h2>
        <p class="hint">Private, on-device voice — nothing leaves your&nbsp;browser.</p>
        <button id="btn-start" class="primary block">Read this page</button>
      </section>

      <!-- loading model / extracting -->
      <section id="view-loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p id="loading-label" class="status">Preparing…</p>
        <div id="loading-bar" class="bar" hidden><div id="loading-fill" class="fill"></div></div>
        <p id="loading-hint" class="hint"></p>
      </section>

      <!-- player (generating / playing / paused / done) -->
      <section id="view-player" hidden>
        <p id="gen-row" class="status gen" hidden>
          <span class="pulse"></span><span id="gen-label"></span>
        </p>
        <div class="controls">
          <button id="btn-prev" class="icon-btn" title="Previous sentence" aria-label="Previous sentence">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5a1 1 0 0 1 2 0v5.2l9.4-5.9A1 1 0 0 1 19 5.2v13.6a1 1 0 0 1-1.6.9L8 13.8V19a1 1 0 1 1-2 0V5z"/></svg>
          </button>
          <button id="btn-toggle" class="primary round" title="Play / pause" aria-label="Play or pause">
            <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.9a1 1 0 0 1 1.5-.9l10.6 6.1a1 1 0 0 1 0 1.8L9.5 19a1 1 0 0 1-1.5-.9V5.9z"/></svg>
            <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5a1.5 1.5 0 0 1 3 0v14a1.5 1.5 0 0 1-3 0V5zm7 0a1.5 1.5 0 0 1 3 0v14a1.5 1.5 0 0 1-3 0V5z"/></svg>
          </button>
          <button id="btn-next" class="icon-btn" title="Next sentence" aria-label="Next sentence">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 5a1 1 0 0 0-2 0v5.2L6.6 4.3A1 1 0 0 0 5 5.2v13.6a1 1 0 0 0 1.6.9l9.4-6v5.3a1 1 0 1 0 2 0V5z"/></svg>
          </button>
          <select id="sel-speed" class="speed" title="Playback speed" aria-label="Playback speed"></select>
        </div>
        <div class="bar"><div id="progress-fill" class="fill"></div></div>
        <p id="sentence-label" class="hint"></p>
      </section>

      <!-- error -->
      <section id="view-error" hidden>
        <p id="error-label" class="status error"></p>
        <button id="btn-retry" class="primary">Try again</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

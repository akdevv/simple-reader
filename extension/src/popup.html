<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="logo">◉</span>
        <h1>Simple Reader</h1>
      </header>

      <!-- idle -->
      <section id="view-idle" hidden>
        <button id="btn-start" class="primary">Read this page</button>
        <p class="hint">Runs entirely in your browser — no data leaves it.</p>
      </section>

      <!-- loading model / extracting -->
      <section id="view-loading" hidden>
        <p id="loading-label" class="status">Preparing…</p>
        <div class="bar"><div id="loading-fill" class="fill"></div></div>
      </section>

      <!-- player (generating / playing / paused / done) -->
      <section id="view-player" hidden>
        <p id="gen-label" class="status" hidden>Generating audio…</p>
        <div class="controls">
          <button id="btn-prev" title="Previous sentence">⏮</button>
          <button id="btn-toggle" class="primary round" title="Play / pause">▶</button>
          <button id="btn-next" title="Next sentence">⏭</button>
        </div>
        <div class="bar"><div id="progress-fill" class="fill"></div></div>
        <p id="sentence-label" class="hint"></p>
      </section>

      <!-- error -->
      <section id="view-error" hidden>
        <p id="error-label" class="status error"></p>
        <button id="btn-retry" class="primary">Try again</button>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
